[package]
name = "cyb-ffmpeg-core"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
authors = ["Cyberseeds"]
description = "FFmpeg-based video decoding core for CYBFFmpeg"
repository = "https://github.com/cyberseeds/CYBFFmpeg"
readme = "README.md"

[lib]
name = "cyb_ffmpeg_core"
# Use staticlib only to avoid dylib loading issues at runtime
crate-type = ["staticlib"]

[features]
default = ["videotoolbox"]
videotoolbox = []

[dependencies]
# FFmpeg bindings — pinned to 7.1 series for FFmpeg 7.1.x compatibility.
#
# DECISION (2026-05-01): Stay on the 7.1 line for stability.
# - NexClip uses MXF demuxer + H.264 (VideoToolbox) + ProRes / DNxHD/HR + AAC /
#   PCM, all available in FFmpeg 7.1
# - 8.x adds VVC encoder, Vulkan H.264/HEVC, WHIP, APV — none required here
# - 8.0.1 + ffmpeg-next 8.0.0 hit non-exhaustive enum match errors
#   (`AV_PKT_DATA_EXIF`, `AV_CODEC_ID_IVTV_VBI`)
# - 7.1 is an LTS candidate with long-term security updates
#
# Do NOT bump to 8.x without revisiting the decision in
# docs/planning/mxf-codec-support.md (kirinuki-ai repo).
ffmpeg-next = { version = "7.1", default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
    "software-resampling",
] }

# Concurrency
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cbindgen = "0.26"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3.10"

# Benchmarks disabled until implemented
# criterion = "0.5"
# [[bench]]
# name = "decode_bench"
# harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
